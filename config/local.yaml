defaults:
  - base
  - _self_

zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: ["Daily/**"]

source:
  arxiv:
    category: [quant-ph, cond-mat.dis-nn, cond-mat.other, cond-mat.quant-gas, cond-mat.stat-mech, cond-mat.str-el, cond-mat.supr-con]
    include_cross_list: false

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  sender_password: ${oc.env:SENDER_PASSWORD}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.decode:${oc.env:SMTP_PORT,465}}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: ${oc.env:LLM_API_MODE,chat_completion}
  language: Chinese
  generation_kwargs:
    model: ${oc.env:LLM_MODEL,glm-5.3-flash}

reranker:
  interests:
    weight: 0.35
    topics:
      - "Neutral-atom quantum computing with Rydberg atom arrays and optical tweezers: quantum processors, entangling gates, scalable architectures, logical qubits and fault-tolerant computation."
      - "Quantum error correction codes: quantum LDPC codes, surface codes, stabilizer codes, bosonic codes, decoding, fault-tolerant logical gates, thresholds and logical quantum memories."

executor:
  fulltext_workers: 3
  llm_workers: 4
  debug: false
  source: [arxiv]
  reranker: local
  max_paper_num: 20

hydra:
  run:
    dir: .
  output_subdir: null
