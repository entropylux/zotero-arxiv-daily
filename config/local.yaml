defaults:
  - base
  - _self_

zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: ["Daily/**"]

source:
  arxiv:
    category: [quant-ph, cond-mat.dis-nn, cond-mat.other, cond-mat.quant-gas, cond-mat.stat-mech, cond-mat.str-el, cond-mat.supr-con]
    include_cross_list: false

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  sender_password: ${oc.env:SENDER_PASSWORD}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.decode:${oc.env:SMTP_PORT,465}}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: ${oc.env:LLM_API_MODE,chat_completion}
  language: Chinese
  generation_kwargs:
    model: ${oc.env:LLM_MODEL,glm-5.3-flash}

reranker:
  prestige:
    bonus: 0.1
    shortlist_size: 25
    institutions:
      - Harvard University
      - Massachusetts Institute of Technology
      - Stanford University
      - California Institute of Technology
      - University of California Berkeley
      - University of Oxford
      - University of Cambridge
      - ETH Zurich
      - ETH Zürich
      - University of Innsbruck
      - Delft University of Technology
      - QuTech
      - University of Maryland
      - Joint Quantum Institute
      - University of Colorado Boulder
      - JILA
      - Institut d'Optique
      - Max Planck Institute of Quantum Optics
      - University of Science and Technology of China
      - Tsinghua University
      - Peking University
      - Google Quantum AI
      - IBM Quantum
      - QuEra
      - Atom Computing
      - Pasqal
    authors:
      - Mikhail D. Lukin
      - Mikhail Lukin
      - Antoine Browaeys
      - Adam M. Kaufman
      - Manuel Endres
      - Jeff D. Thompson
      - Jeff Thompson
      - John Preskill
      - Barbara M. Terhal
      - Barbara Terhal
      - Daniel Gottesman
  interests:
    weight: 0.35
    topics:
      - "Neutral-atom quantum computing with Rydberg atom arrays and optical tweezers: quantum processors, entangling gates, scalable architectures, logical qubits and fault-tolerant computation."
      - "Quantum error correction codes: quantum LDPC codes, surface codes, stabilizer codes, bosonic codes, decoding, fault-tolerant logical gates, thresholds and logical quantum memories."

executor:
  fulltext_workers: 3
  llm_workers: 4
  debug: false
  source: [arxiv]
  reranker: local
  max_paper_num: 20

hydra:
  run:
    dir: .
  output_subdir: null
